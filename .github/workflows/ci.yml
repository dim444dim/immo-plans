name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    # 24 erreurs biome deja presentes dans le code au 04/11 (degrades CSS Tailwind 4) :
    # continue-on-error pour ne pas faire echouer la CI tout de suite.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build:css
